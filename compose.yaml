services:
  db:
    image: postgres:17.6-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: privatechat
      POSTGRES_PASSWORD: privatechat_dev_only
      POSTGRES_DB: privatechat
    volumes: ["privatechat_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privatechat -d privatechat"]
      interval: 3s
      timeout: 3s
      retries: 10
  tide:
    profiles: ["tide"]
    image: ${TIDECLOAK_IMAGE:-tideorg/tidecloak-dev@sha256:3f52d0bc3e4e3ae5153e172960003bbe94705cd40af6561fd4c7c4434aaa2708}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TIDE_ADMIN_PASSWORD:-demo-admin-change-before-use}
    volumes: ["privatechat_tide:/opt/keycloak/data/h2"]
    # Development only. Complete setup/license/enrollment in the console.
volumes:
  privatechat_pg:
  privatechat_tide:
